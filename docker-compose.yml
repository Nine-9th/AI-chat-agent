services:
  agent:
    build: .
    image: ai-chat-agent
    env_file: .env
    # The agent can only modify the sample project, nothing else on your machine
    volumes:
      - ./calculator:/app/calculator
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
